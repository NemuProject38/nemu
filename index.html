<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#06121f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nemu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="ocean" id="ocean" aria-label="Nemu">
    <div class="room-image" aria-hidden="true"></div>
    <div class="water-glow" aria-hidden="true"></div>
    <div class="caustics caustics-a" aria-hidden="true"></div>
    <div class="caustics caustics-b" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div id="particles" class="particles" aria-hidden="true"></div>
    <div id="ripples" class="ripples" aria-hidden="true"></div>

    <img src="nemu-fish.PNG" alt="" class="fish" aria-hidden="true" />

    <header class="brand" aria-label="Nemu">
      <span>NEMU</span>
    </header>

    <nav class="dock" aria-label="room actions">
      <button class="glass-button" type="button" data-action="flower" aria-label="flower">
        <span aria-hidden="true">✦</span>
      </button>
      <button class="glass-button center-button" type="button" data-action="ripple" aria-label="ripple">
        <span class="ripple-icon" aria-hidden="true"></span>
      </button>
      <button class="glass-button" type="button" data-action="visit" aria-label="visit">
        <span aria-hidden="true">◌</span>
      </button>
    </nav>

    <div id="giftLayer" class="gift-layer" aria-hidden="true"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
